############################################
GlueLayer_ToolConfigSelection=1
user_ports_tcp_name=Autotest
user_ports_tcp_port=7555
debug_console=1
debug_device=1
debug_dir=/data/vendor/gps
############################################
GlueLayer_IsGedKeyExist=1
Sif_UseFwXtraInterface=0
GlueLayer_isForceIPV6=0
GlueLayer_EnableGnssCfgInterface=1
debug_enable=1

# Test this during bring-up.
# At some point, we should be able to drop this as it will be detected with the chip_specific code
gnss_device_type=K050

### Update for VTS ###
GlueLayer_YearOfHW=2016
scheduling_enabled=0

### temporarily disable precise time aiding ###
Chip_Configuration_AidingConfiguration=0x00020046

### Enable MEMS static detection and heading filter ###
Chip_Configuration_mems_data_Configuration=5

### 2848 L1 + L5 MCW ###
Chip_Configuration_GNSSConstConstraintDef=0x60AF
LocTech_Constraints=0x60AF
Chip_Configuration_RfMiscCtrl=0x80008001

### 2248 L1 HYSPDY ###
#Chip_Configuration_GNSSConstConstraintDef=0x602F
#Chip_Configuration_RfMiscCtrl=0x1

### 2848 L1 only MCW ###
#Chip_Configuration_GNSSConstConstraintDef=0x602F
#LocTech_Constraints=0x602F
#Chip_Configuration_RfMiscCtrl=0x80008001

### 2848 L1 + L5 MCW + NavIC ###
#Chip_Configuration_GNSSConstConstraintDef=0x60EF
#LocTech_Constraints=0x60EF
#Chip_Configuration_RfMiscCtrl=0x80008001

# This is a bitfield that will disable incoming interrupts for mailboxes
# AP   = 0x1
# CP   = 0x4
# CHUB = 0x8
# The CHUB on the neus continually triggers a bit so this is to prevent
# it from continually waking the gnss.
mailboxDisabled=0x8

### Specify RFIC ID for K50 ###
# 55110001 = S5511
gnss_rfic_chip_id=55110001

# Disable SUPL
#Aiding_AidingType=0
# Ignore Android Framework Requests to Enable SUPL
GlueLayer_EnableFwConfiguration=0
# Allow Ref Location for Cold and Hot Starts
GlueLayer_isLocalRefLocInColdStart=2
